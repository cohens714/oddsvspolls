name: Snapshot markets

# Hourly. Was four times a day, which is plenty for displaying a daily
# figure but too coarse for the question of whether markets move before or
# after a poll is published. Answering that needs resolution finer than the
# gap between a poll appearing and the market repricing.
#
# Thirteen races across two venues is 26 requests an hour. Negligible.
#
# GitHub's scheduler is best-effort and often runs late. That is fine:
# every row records its own fetched_at, so analysis uses the real time
# rather than the intended one. Never treat the cron time as the
# observation time.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A slow run is skipped rather than queued. Two jobs pushing at once causes
# the conflicts the retry loop below exists to avoid.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ingest_markets.py is standard library only. Keep it that way if you
      # can; a dependency-free collector is far less likely to break
      # silently months from now.

      - name: Verify parsers before touching the network
        working-directory: analysis
        run: python3 ingest_markets.py --self-test

      - name: Fetch snapshot
        working-directory: analysis
        run: python3 ingest_markets.py

      - name: Commit if anything changed
        run: |
          git config user.name  "oddsvspolls-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data/; then
            echo "No change to data/, nothing to commit."
            exit 0
          fi

          git add data/
          git commit -m "Snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The poll workflow may have pushed while this was fetching.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            sleep 5
          done

          echo "Push failed after 3 attempts." >&2
          exit 1
