<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Odds vs Polls — where prediction markets and polling disagree</title>

    <!-- Shown in search results and, on some platforms, under the link
         title in a shared post. Leads with the comparison rather than the
         subject: "tracks elections" describes a category, "shows where two
         forecasts disagree" describes a reason to look. -->
    <meta name="description" content="Prediction market prices for the 2026 Senate and governor races next to what the polling implies, updated daily. Every figure is a recorded observation with a timestamp, and the methodology is published." />

    <link rel="canonical" href="https://oddsvspolls.com/" />

    <!-- Open Graph. Most people meet this site as an unfurled card in a
         feed and decide from that alone, so the card is the pitch. og.png
         is regenerated from live data on every build, which is why it can
         name specific races rather than describing the site in general. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oddsvspolls.com/" />
    <meta property="og:site_name" content="Odds vs Polls" />
    <meta property="og:title" content="Where prediction markets and polling disagree" />
    <meta property="og:description" content="2026 Senate and governor races: what the markets price, what the polls imply, and the gap between them. Updated daily." />
    <meta property="og:image" content="https://oddsvspolls.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Summary card listing races where prediction markets and polling averages name different winners." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where prediction markets and polling disagree" />
    <meta name="twitter:description" content="2026 Senate and governor races: what the markets price, what the polls imply, and the gap between them." />
    <meta name="twitter:image" content="https://oddsvspolls.com/og.png" />

    <meta name="theme-color" content="#faf9f7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
